<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIG BANG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#020617;color:#fff;font-family:Tahoma,sans-serif;padding-bottom:80px}
.topbar{position:sticky;top:0;z-index:10;background:#0f172a;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b}
.topbar b{font-size:20px;letter-spacing:1px}
.page{display:none;padding:15px}
.page.active{display:block}
.atf-card{background:linear-gradient(135deg,#0e2a4a,#0b1e3a);border:1px solid #1e90ff55;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.atf-icon{font-size:24px}
.atf-pill{background:#00000088;border-radius:20px;padding:6px 12px;font-weight:bold;white-space:nowrap}
.atf-green{color:#22ff88;font-weight:bold}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.btn{border:none;border-radius:12px;padding:12px;width:100%;font-family:inherit;font-weight:bold;font-size:16px;cursor:pointer;color:#fff;background:linear-gradient(90deg,#00c6ff,#00e676)}
.btn2{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:12px;padding:10px;width:100%;font-family:inherit;font-weight:bold;cursor:pointer}
input,select{width:100%;background:#000;color:#fff;border:1px solid #334155;border-radius:12px;padding:12px;font-family:inherit;font-size:16px;outline:none}
label{font-size:13px;color:#94a3b8;display:block;margin:8px 0 5px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #1e293b;display:flex;justify-content:space-around;padding:8px 0 10px;z-index:20}
.bottom div{text-align:center;font-size:13px;cursor:pointer;color:#94a3b8;line-height:1.4}
.bottom div.active{color:#22ff88;font-weight:bold}
.small{font-size:12px;color:#94a3b8;line-height:1.8}
.green{color:#22ff88}.red{color:#ff5a5a}.gold{color:#ffd700}
.flex{display:flex;gap:8px}.flex>*{flex:1}
.tabs{display:flex;background:#000;border:1px solid #1e90ff88;border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:transparent;color:#94a3b8;padding:10px;border-radius:10px;font-family:inherit;font-weight:bold;cursor:pointer}
.tabs button.active{background:linear-gradient(90deg,#00c6ff,#00e676);color:#fff}
.miner-row{display:flex;justify-content:space-between;align-items:center;background:#1e293b;border-radius:12px;padding:10px;margin-bottom:8px}
.tag{background:#22ff8822;color:#22ff88;padding:2px 8px;border-radius:20px;font-size:11px}
/* مارکت - وسط */
.market-head{padding:6px 15px 0;text-align:center}
.market-head h1{text-align:center;margin:0;font-size:28px}
.market-head p{text-align:center;margin:4px 0 0;color:#94a3b8}
.market-card{background:linear-gradient(135deg,#0e2a4a,#0b1e3a);border:1px solid #1e90ff88;border-radius:16px;padding:14px;margin-bottom:12px}
.inp-box{background:#000;border:1px solid #1e90ff88;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.inp-box input{border:none;padding:8px;font-size:20px;font-weight:bold;text-align:left;direction:ltr}
</style>
</head>
<body>
<div class="topbar"><b>BIG BANG</b><span id="topBal">0 BIG</span></div>

<!-- ماین -->
<div id="page-home" class="page active">
  <div class="atf-card" id="assetsCard"><div class="atf-icon">💰</div><div style="flex:1"><b data-t="assets"></b></div><div class="atf-pill">≈ <span id="assetsUsd">0.00</span>$</div></div>
  <div class="atf-card" id="holdingCard"><div class="atf-icon">💳</div><div style="flex:1"><b data-t="holding"></b></div><div class="atf-green" style="font-size:20px"><span id="holdingBig">0</span> BIG</div></div>
  <div class="card" style="text-align:center">
    <div style="font-size:13px;color:#94a3b8" data-t="pool"></div>
    <div style="font-size:32px;font-weight:bold"><span id="poolBig">0</span> BIG</div>
    <div class="small"><span data-t="perHour"></span>: <b class="green" id="perHour">0</b> | <span data-t="power"></span>: <b id="powerTxt">0</b></div>
    <br>
    <div style="font-size:18px">⏳ <span id="timer">00:00:00</span></div>
    <div class="small" id="claimInfo"></div><br>
    <button class="btn" onclick="claim()" data-t="claim"></button>
  </div>
  <div class="card">
    <b data-t="walletTitle"></b>
    <div class="small" id="walletStatus"></div><br>
    <div id="ton-connect"></div><br>
    <button class="btn2" onclick="clearWallet()" data-t="disconnect"></button>
  </div>
</div>

<!-- ماینر ها -->
<div id="page-miners" class="page">
  <div class="card"><b data-t="minersTitle"></b><div class="small" data-t="minersDesc"></div></div>
  <div id="minersList"></div>
</div>

<!-- مارکت -->
<div id="page-market" class="page">
  <div class="market-head"><h1 data-t="market"></h1><p data-t="marketSub"></p></div><br>
  <div class="market-card">
    <div style="display:flex;justify-content:space-between"><b>BIG / TON</b><a href="https://ston.fi" target="_blank" style="background:#000;color:#fff;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:13px">↗ STON.fi</a></div><br>
    <div style="text-align:left;font-size:20px;font-weight:bold" dir="ltr">0.000101 TON</div>
    <div class="small" data-t="marketPrice"></div>
  </div>
  <div class="tabs"><button id="tabBuy" class="active" onclick="setTab('buy')" data-t="buy"></button><button id="tabSell" onclick="setTab('sell')" data-t="sell"></button><button id="tabHist" onclick="setTab('hist')" data-t="history"></button></div>
  <div class="card" id="tradeBox">
    <label data-t="youPay"></label>
    <div class="inp-box"><input id="payInp" value="1" inputmode="decimal"><button onclick="setMax()" style="background:#00e676;border:none;border-radius:8px;padding:6px 10px;font-weight:bold">MAX</button><b>TON</b></div>
    <div class="small" style="text-align:left"><span data-t="balance"></span>: <span id="tradeBal">86</span> BIG</div>
    <div style="text-align:center;font-size:20px;margin:8px">⇅</div>
    <label data-t="youGet"></label>
    <div class="inp-box"><input id="getInp" value="9,835" readonly><b>BIG</b></div>
    <div class="small" data-t="liveEst"></div><br>
    <button class="btn" onclick="doTrade()" data-t="buy"></button>
    <div class="small" style="margin-top:8px"><span data-t="fee"></span>: 0.05 TON</div>
  </div>
</div>

<!-- رفرال گیری -->
<div id="page-referral" class="page">
  <div class="card" style="text-align:center"><b style="font-size:20px" data-t="refTitle"></b><div class="small" data-t="refDesc"></div><br>
  <div style="background:#000;border-radius:12px;padding:10px;word-break:break-all" id="refLink">...</div><br>
  <button class="btn" onclick="copyRef()" data-t="copy"></button><br><br>
  <button class="btn2" onclick="shareRef()" data-t="share"></button></div>
  <div class="card"><b data-t="myRefs"></b><div id="refList" class="small"></div></div>
</div>

<!-- پروفایل -->
<div id="page-profile" class="page">
  <div class="card" style="text-align:center"><div style="font-size:40px">👤</div><b id="profName">User</b><div class="small" id="profId"></div></div>
  <div class="card"><label data-t="lang"></label><select id="langSel" onchange="setLang(this.value)"><option value="fa">فارسی</option><option value="en">English</option><option value="ps">پښتو</option></select></div>
  <div class="card"><b data-t="withdraw"></b><label data-t="amount"></label><input id="wdAmt" inputmode="numeric"><label data-t="walletAddr"></label><input id="wdAddr" placeholder="UQ..."><br><button class="btn" onclick="withdraw()" data-t="withdrawBtn"></button><div class="small" id="wdInfo"></div></div>
</div>

<div class="bottom">
  <div onclick="go('home',this)" class="active">⛏️<br><span data-t="nav_home"></span></div>
  <div onclick="go('miners',this)">👥<br><span data-t="nav_miners"></span></div>
  <div onclick="go('market',this)">💎<br><span data-t="nav_market"></span></div>
  <div onclick="go('referral',this)">👥<br><span data-t="nav_ref"></span></div>
  <div onclick="go('profile',this)">👤<br><span data-t="nav_profile"></span></div>
</div>

<script>
let tg=window.Telegram?.WebApp; tg?.expand();
let uid=tg?.initDataUnsafe?.user?.id||123456;
let userName=tg?.initDataUnsafe?.user?.first_name||'User';
let bal=1200, holdBalance=0, realHoldBalance=0, wallet='', lang=localStorage.getItem('big_lang')||'fa';
const BIG_PRICE_USD=0.000112;
const MINERS=[{n:'Starter',p:10,price:0},{n:'Pro',p:100,price:10},{n:'Mega',p:1000,price:100}];

const TR={
fa:{nav_home:'ماین',nav_miners:'ماینر ها',nav_market:'مارکت',nav_ref:'رفرال گیری',nav_profile:'پروفایل',assets:'دارایی ها',holding:'کیف پول هولدینگ',pool:'کیف پول Pool',perHour:'در ساعت',power:'قدرت',claim:'دریافت پاداش',walletTitle:'کیف پول TON',disconnect:'قطع اتصال',minersTitle:'ماینر ها',minersDesc:'ماینر بخر و قدرتت را بالا ببر',market:'مارکت',marketSub:'معامله BIG با TON',marketPrice:'قیمت مارکت • 1 BIG',buy:'خرید',sell:'فروش',history:'تاریخچه',youPay:'تو پرداخت میکنی',youGet:'تو دریافت میکنی',balance:'موجودی',liveEst:'تخمین زنده • معامله در STON.fi',fee:'کارمزد خدمات',refTitle:'دعوت دوستان',refDesc:'با دعوت دوستان پاداش بگیر',copy:'کپی لینک',share:'اشتراک گذاری',myRefs:'رفرال های من',lang:'زبان',withdraw:'برداشت',amount:'مقدار BIG',walletAddr:'آدرس ولت',withdrawBtn:'برداشت'},
en:{nav_home:'Mine',nav_miners:'Miners',nav_market:'Market',nav_ref:'Referral',nav_profile:'Profile',assets:'Assets',holding:'Holding Wallet',pool:'Pool Wallet',perHour:'Per Hour',power:'Power',claim:'Claim Reward',walletTitle:'TON Wallet',disconnect:'Disconnect',minersTitle:'Miners',minersDesc:'Buy miner to increase power',market:'Market',marketSub:'Trade BIG with TON',marketPrice:'Market Price • 1 BIG',buy:'Buy',sell:'Sell',history:'History',youPay:'You Pay',youGet:'You Get',balance:'Balance',liveEst:'Live Estimate • Trade on STON.fi',fee:'Service Fee',refTitle:'Invite Friends',refDesc:'Invite friends and earn rewards',copy:'Copy Link',share:'Share',myRefs:'My Referrals',lang:'Language',withdraw:'Withdraw',amount:'Amount BIG',walletAddr:'Wallet Address',withdrawBtn:'Withdraw'}
};
TR.ps=TR.fa;

function t(k){return (TR[lang]||TR.fa)[k]||k}
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>{e.innerText=t(e.dataset.t)});document.getElementById('langSel').value=lang}
function setLang(v){lang=v;localStorage.setItem('big_lang',v);applyLang();update()}

function isWalletConnected(){return !!wallet}
function getHolding(){return isWalletConnected()?realHoldBalance:0}

async function fetchRealHold(){
  if(!wallet) {realHoldBalance=0; update(); return}
  try{
    let r=await fetch(`https://tonapi.io/v2/accounts/${wallet}/jettons?currencies=usd`);
    let j=await r.json();
    let found=(j.balances||[]).find(x=>x.jetton?.symbol==='BIG');
    if(found){realHoldBalance=Number(found.balance)/Math.pow(10,found.jetton.decimals||9)} else {realHoldBalance=0}
  }catch(e){realHoldBalance=0}
  update();
}
function clearWallet(r){
  wallet=''; realHoldBalance=0; // فقط هولد ولت صفر میشه، bal دست نمیخوره
  fillWalletUI(); update();
}
function fillWalletUI(){
  document.getElementById('walletStatus').innerText = wallet ? '✅ '+wallet.slice(0,6)+'...'+wallet.slice(-4) : '❌ ولت وصل نیست - هولدینگ 0';
}

function update(){
  // ولت قطع = هولد 0 ، ولی موجودی مینی آپ (Pool) سر جاش میمونه
  var _walletConnected = wallet && isWalletConnected();
  var _hold = _walletConnected ? Math.round(realHoldBalance) : 0;
  var _pool = Math.round(bal);
  var _assets = _pool + _hold;

  var _hb=document.getElementById('holdingBig'); if(_hb) _hb.innerText=_hold;
  var _pb=document.getElementById('poolBig'); if(_pb) _pb.innerText=_pool;
  var _au=document.getElementById('assetsUsd'); if(_au) _au.innerText=(_assets*BIG_PRICE_USD).toFixed(2);
  var _tb=document.getElementById('topBal'); if(_tb) _tb.innerText=_pool+' BIG';
  var _hc=document.getElementById('holdingCard'); if(_hc) _hc.style.display='flex';
  var _ac=document.getElementById('assetsCard'); if(_ac) _ac.style.display='flex';
  document.getElementById('perHour').innerText=100;
  document.getElementById('powerTxt').innerText='1.0 TH/s';
  document.getElementById('refLink').innerText='https://t.me/BIGBANG_Bot?start='+uid;
  document.getElementById('profName').innerText=userName;
  document.getElementById('profId').innerText='ID: '+uid;
}
function go(p,el){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.bottom div').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  window.scrollTo(0,0);
}
function claim(){bal+=10;update();alert('✅ +10 BIG')}
function setTab(m){document.getElementById('tabBuy').classList.toggle('active',m==='buy');document.getElementById('tabSell').classList.toggle('active',m==='sell');document.getElementById('tabHist').classList.toggle('active',m==='hist')}
function setMax(){document.getElementById('payInp').value=1}
function doTrade(){alert('در حال اتصال به STON.fi...')}
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLink').innerText);alert('کپی شد')}
function shareRef(){if(navigator.share) navigator.share({text:document.getElementById('refLink').innerText}); else copyRef()}
function withdraw(){let a=Number(document.getElementById('wdAmt').value); if(!a||a>bal) return alert('موجودی کافی نیست'); bal-=a; update(); alert('درخواست برداشت ثبت شد')}
function renderMiners(){document.getElementById('minersList').innerHTML=MINERS.map(m=>`<div class="miner-row"><div><b>${m.n}</b><div class="small">${m.p} GH/s</div></div><button class="btn" style="width:100px" onclick="alert('خرید ${m.n}')">${m.price===0?'رایگان':m.price+' TON'}</button></div>`).join('')}

applyLang(); renderMiners(); fillWalletUI(); update(); fetchRealHold();
setInterval(()=>{fetchRealHold()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) fetchRealHold()});
</script>
</body>
</html>
